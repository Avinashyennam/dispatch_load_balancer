spring:
  application:
    name: dispatch-load-balancer

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/load-dispatch}
    username: postgres
    password: Admin
    # driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
